name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install || npm install || echo "no install"
      - run: bun run lint || npm run lint || echo "no lint"
      - run: bun test || npm test || echo "no tests"
      - run: bun run build || npm run build || echo "no build"